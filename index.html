<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEZA YORK - DOBLE MODO</title>
<style>
body{margin:0;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#counter{font-size:12px;font-weight:bold}
#alerta{display:none;padding:12px;text-align:center;font-weight:bold;font-size:12px;border:3px solid;margin:6px;line-height:1.2}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{padding:7px 12px;border-radius:14px;font-size:13px;max-width:88%}
#controls{display:flex;padding:8px;gap:6px}
input{flex:1;padding:12px;border-radius:24px;border:none}
button{border:none;padding:12px 16px;border-radius:24px;font-weight:bold;cursor:pointer}
body.toxico{background:#000;color:#fff}
body.toxico header{background:#111;border-bottom:2px solid #ffcc00}
body.toxico #counter{color:#00ff88}
body.toxico #alerta{background:#ff0000;color:#fff;border-color:#ffff00;animation:blink 0.5s infinite}
body.toxico #chat{background:#080808}
body.toxico .m0{background:#1a1010;border-left:3px solid #ff0033}
body.toxico .m1{background:#101a14;border-left:3px solid #00ff88}
body.toxico .m2{background:#10141a;border-left:3px solid #0099ff}
body.toxico .mfan{background:#332a00;border-left:4px solid #ffcc00}
body.toxico .mdef{background:#2a1010;border-left:4px solid #ff3300}
body.toxico #controls{background:#111}
body.toxico input{background:#222;color:#fff}
body.toxico button{background:#ffcc00;color:#000}
body.chisme{background:#fef9ef;color:#4a4a4a}
body.chisme header{background:#ffecd1;border-bottom:2px solid #ffbf69}
body.chisme #counter{color:#ff7f50}
body.chisme #alerta{background:#fff3b0;color:#6b4c00;border-color:#ffbf69;border-radius:12px}
body.chisme #chat{background:#fffaf0}
body.chisme .m0{background:#ffe5d9;border-left:4px solid #ff7f51}
body.chisme .m1{background:#d8e2dc;border-left:4px solid #52b788}
body.chisme .m2{background:#cce3de;border-left:4px solid #40916c}
body.chisme .mfan{background:#fff3b0;border-left:4px solid #ffb703}
body.chisme #controls{background:#ffecd1}
body.chisme input{background:#fff;border:1px solid #ffbf69;color:#4a4a4a}
body.chisme button{background:#ffb703;color:#6b4c00}
@keyframes blink{0%{background:#ff0000}50%{background:#cc0000}100%{background:#ff0000}}
</style>
</head>
<body class="toxico">
<header>
<div>● <b id="counter">1,247,392 personas escribiendo...</b></div>
<button onclick="toggleModo()" id="btnModo">🌸 Cambiar a Chismecito</button>
<div id="titulo" style="font-size:11px">NEZA YORK MERA VERDURA</div>
</header>
<div id="alerta"></div>
<div id="chat"></div>
<div id="controls"><input id="inp" placeholder="Escribe anónimo..."><button onclick="sendUser()">Enviar</button></div>
<script>
let modo='toxico';
let loopId=null;
const chat=document.getElementById('chat');
const alerta=document.getElementById('alerta');

const FRASES_TOXICO_POR_ESCUELA={
"Técnica 51":["haber we pasen tarea culeros soy de la 51","puro barrio de la Técnica 51 culeros","en la 51 si rifamos a la verga"],
"Técnica 91":["alch la Técnica 91 rifa más culeros","soy de la 91 y me la pelan todos","en la 91 si hay barrio we"],
"Técnica 100":["la Técnica 100 es la mera verga","puro 100 rifa culeros","en la 100 puro desmadre chido"],
"Telesecundaria 88":["que pedo pendejos de la Telesecundaria 88 no rifa","Telesecundaria 88 puro morro meco","88 vale verga we"],
"Telesecundaria 115":["Telesecundaria 115 puro pendejo","115 no rifa ni madres","que pedo con la 115 culeros"],
"San Alfonso 1024":["San Alfonso 1024 rifa bien culero","puro San Alfonso 1024 la mera verdura","1024 es dios we"],
"San Alfonso 697":["San Alfonso 697 la mejor a la verga","697 rifa culero","puro 697 a la verga"]
};

const FRASES_CHISME_POR_ESCUELA={
"Técnica 51 💅":["oigan chisme, en la Técnica 51 van a hacer kermés bien bonita","en la Técnica 51 van a vender fresas con crema","dicen que la Técnica 51 ganó concurso de baile"],
"Técnica 91 🌸":["chisme bonito, la Técnica 91 va a hacer excursión al museo","en la Técnica 91 la maestra nos va a dejar salir temprano","dicen que en la 91 van a poner jardín bien bonito"],
"Técnica 100 ☕":["oigan que en la Técnica 100 van a vender elotes bien ricos","en la Técnica 100 van a hacer torneo de futbol amistoso","dicen que la Técnica 100 va a tener día de disfraces bonito"],
"Telesecundaria 88 🌼":["chisme, Telesecundaria 88 va a hacer picnic con frutita","en la 88 van a pintar mural bien colorido","dicen que Telesecundaria 88 va a hacer obra de teatro"],
"San Alfonso 1024 📚":["oigan que en San Alfonso 1024 van a hacer concurso de dibujo","en San Alfonso 1024 la biblioteca quedó bien bonita","dicen que San Alfonso 1024 va a tener feria de ciencias"],
"San Alfonso 697 🎀":["chismecito, San Alfonso 697 va a hacer intercambio de libros","en San Alfonso 697 van a hacer tarde de lectura bonita","dicen que San Alfonso 697 va a hacer concurso de poemas"],
"Telesecundaria 12 ✨":["vi que los de la Telesecundaria 12 ensayan baile para el festival","en la Telesecundaria 12 van a hacer día de burbujas","dicen que la 12 va a hacer concurso de canto bonito"]
};

const botsToxico=Object.keys(FRASES_TOXICO_POR_ESCUELA).map((n,i)=>({name:n,c:["m0","m0","m0","m1","m1","m2","m2"][i]}));
const botsChisme=Object.keys(FRASES_CHISME_POR_ESCUELA).map((n,i)=>({name:n,c:["m0","m0","m0","m1","m2","m2","m1"][i]}));

const ALERTA_TOXICA="ADVERTENCIA NECESITAMOS ORDEN EN LA PÁGINA O DE LO CONTRARIO LO TOMARAN COMO INFRINGIR LAS REGLAS Y TENDREMOS QUE INHABILITAR LA PAGINA AQUI EN NEZA NO TOLERAMOS ESAS FALTAS EN LA PÁGINA WEB O SERAS SANCIONADO SIN PODER ENTRAR A LA PÁGINA WEB";
const ALERTA_CHISME="☕ CHISMECITO TIME: NECESITAMOS BUEN ROLLO EN LA PÁGINA, AQUÍ EN NEZA VALORAMOS EL RESPETO, SI HACES CHISME FEO TE DAMOS TIME OUT DE 5 MIN SIN PODER CHISMEAR ☕";

function setAlerta(t){ alerta.textContent=t; alerta.style.display="block"; setTimeout(()=>alerta.style.display="none",6000); }

function add(bot,text){
 const d=document.createElement('div'); d.className='msg '+bot.c;
 d.innerHTML=`<b>${bot.name}</b> ${text}`; chat.appendChild(d);
 if(chat.children.length>150) chat.removeChild(chat.firstChild);
 chat.scrollTop=chat.scrollHeight;
 if(text.toLowerCase().includes("neza york") && text.toLowerCase().includes("no rifa") && modo==='toxico'){ setAlerta(ALERTA_TOXICA); }
}

function iniciarLoop(){
 if(loopId) clearTimeout(loopId);
 function tick(){
   if(modo==='toxico'){
     const bot=botsToxico[Math.floor(Math.random()*botsToxico.length)];
     const lista=FRASES_TOXICO_POR_ESCUELA[bot.name];
     const frase=lista[Math.floor(Math.random()*lista.length)];
     add(bot,frase);
   } else {
     const bot=botsChisme[Math.floor(Math.random()*botsChisme.length)];
     const lista=FRASES_CHISME_POR_ESCUELA[bot.name];
     const frase=lista[Math.floor(Math.random()*lista.length)];
     add(bot,frase);
   }
   loopId=setTimeout(tick, modo==='toxico'?600:1400);
 }
 tick();
}

function toggleModo(){
 chat.innerHTML=''; alerta.style.display="none";
 if(modo==='toxico'){
   modo='chisme'; document.body.className='chisme';
   document.getElementById('btnModo').textContent='🔥 Cambiar a Tóxico';
   document.getElementById('titulo').textContent='CHISMECITO NEZA YORK';
   document.getElementById('inp').placeholder='Cuenta tu chisme bonito...';
   setAlerta(ALERTA_CHISME);
 } else {
   modo='toxico'; document.body.className='toxico';
   document.getElementById('btnModo').textContent='🌸 Cambiar a Chismecito';
   document.getElementById('titulo').textContent='NEZA YORK MERA VERDURA';
   document.getElementById('inp').placeholder='Escribe anónimo...';
   setAlerta(ALERTA_TOXICA);
 }
 iniciarLoop();
}

function sendUser(){
 const i=document.getElementById('inp'); if(!i.value.trim()) return;
 add({name:"TÚ",c:"mfan"}, i.value); i.value='';
}

setAlerta(ALERTA_TOXICA);
iniciarLoop();
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') sendUser()});
</script>
</body>
</html>
