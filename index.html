<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEZA LITE NO SE TRABA</title>
<style>
body{margin:0;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:6px;display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
#global{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;padding:14px;text-align:center;font-weight:900;font-size:11px;border-bottom:3px solid #fff;line-height:1.2}
#alerta{display:none;padding:8px;text-align:center;font-weight:bold;font-size:10px;border:2px solid;margin:4px;margin-top:50px}
#servidor{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;padding:20px;text-align:center;font-weight:900;font-size:12px;border:3px solid;border-radius:14px;width:80%;max-width:350px}
#chat{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
.msg{padding:6px 10px;border-radius:12px;font-size:12px;max-width:90%;word-break:break-word}
#controls{display:flex;padding:6px;gap:4px}
input{flex:1;padding:10px;border-radius:20px;border:none;font-size:14px}
button{border:none;padding:6px 8px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:10px}
#btnGlobal{background:#ff0000;color:yellow;border:2px solid yellow}
#btnInvadir{background:#000;color:#ff0000;border:2px solid #ff0000}
#btnCodigo{background:#111;color:#00ff88;border:2px solid #00ff88}
#btnClear{background:#333;color:#fff;border:1px solid #555}
body.toxico{background:#000;color:#fff}body.toxico header{background:#111}body.toxico #global{background:#ff0000;color:yellow}
body.toxico #alerta{background:#ff0000;color:#fff}body.toxico #chat{background:#080808}body.toxico #servidor{background:#111;color:#ffcc00;border-color:#ffcc00}
body.toxico .m0{background:#1a1010;border-left:3px solid red}body.toxico .m1{background:#101a14;border-left:3px solid #00ff88}
body.toxico .m2{background:#10141a;border-left:3px solid #0099ff}body.toxico .mfan{background:#332a00;border-left:3px solid #ffcc00}
body.toxico .minv{background:#1a0000;border-left:3px solid #ff0000}body.toxico .msusto{background:#332200;border-left:3px solid #ffaa00}
body.toxico .mcodigo{background:#001a00;border-left:3px solid #00ff88;color:#00ff88}
body.toxico #controls{background:#111}body.toxico input{background:#222;color:#fff}
body.chisme{background:#fef9ef;color:#4a4a4a}body.chisme header{background:#ffecd1}
body.chisme #global{background:#ff006e;color:white}body.chisme #alerta{background:#fff3b0;color:#6b4c00;border-radius:10px}body.chisme #chat{background:#fffaf0}
body.chisme #servidor{background:#ffecd1;color:#6b4c00;border-color:#ffbf69}
body.chisme .m0{background:#ffe5d9;border-left:3px solid #ff7f51}body.chisme .m1{background:#d8e2dc;border-left:3px solid #52b788}
body.chisme .m2{background:#cce3de;border-left:3px solid #40916c}body.chisme .mfan{background:#fff3b0;border-left:3px solid #ffb703}
body.chisme .minv{background:#2b0000;color:#ffcccc;border-left:3px solid red}body.chisme .msusto{background:#fff0c0;color:#5a3d00;border-left:3px solid #ff8c00}
body.chisme .mcodigo{background:#e0ffe0;color:#004400;border-left:3px solid #00aa00}
body.chisme #controls{background:#ffecd1}body.chisme input{background:#fff;border:1px solid #ffbf69}
body.chisme.invadido{background:#2a0f0f}body.chisme.invadido #chat{background:#1f0f0f}
</style>
</head>
<body class="toxico">
<div id="global"></div>
<div id="servidor"></div>
<header>
<div>● <b id="srv">S1</b> <span id="timerInv" style="color:red"></span></div>
<div style="display:flex;gap:3px;flex-wrap:wrap">
<button id="btnGlobal" onclick="lanzarGlobalEscuela()">GLOBAL</button>
<button id="btnInvadir" onclick="invadirChismecito()">INVADIR</button>
<button id="btnCodigo" onclick="ataqueCodigo()">CÓDIGO</button>
<button id="btnClear" onclick="limpiarChat()">LIMPIAR</button>
<button id="btnModo" onclick="toggleModo()">Chisme</button>
</div>
</header>
<div id="alerta"></div>
<div id="chat"></div>
<div id="controls"><input id="inp" placeholder="/global /invadir /codigo"><button onclick="sendUser()">Enviar</button></div>
<script>
let modo='toxico';let timer=null;let invadido=false;let servidorNum=1;let timerInvasion=null;let timerCuenta=null;
const chat=document.getElementById('chat');const alerta=document.getElementById('alerta');const globalMsg=document.getElementById('global');const servidorDiv=document.getElementById('servidor');
const botsT=["Técnica 51","Técnica 91","Técnica 100","Telesecundaria 88","Telesecundaria 115","San Alfonso 1024","San Alfonso 697"];
const botsC=["Técnica 51 💅","Técnica 91 🌸","Técnica 100 ☕","Telesecundaria 88 🌼","San Alfonso 1024 📚","San Alfonso 697 🎀","Telesecundaria 12 ✨"];
const basesT=["haber we pasen tarea","que pedo pendejos de la","nmms que hueva","alch chinga tu madre","wey no mames que culero","jajaja techo de menos pendejo","haber pinche morro pendejo","a ver es a ver no haber verga","ya callate a la verga","chesco y a chingar a su madre","haber quien se rifa un tiro","que pedo hijos de su puta madre","nmms me vale verga","alch me la pelan los de la","wey chinga tu madre si eres de la"];
let TOXICO=[];let CHISME=[];
for(let i=0;i<200;i++){let b=basesT[i%basesT.length];let escuela=botsT[i%botsT.length];TOXICO.push(`${b} ${escuela} #${i+1}`);}
const basesC=["van a hacer kermés bien bonita","van a vender fresas con crema","ganó concurso de baile","va a hacer excursión al museo","la maestra nos va a dejar salir temprano","van a poner jardín bien bonito","van a vender elotes bien ricos","va a hacer torneo de futbol","va a tener día de disfraces","va a hacer picnic con frutita","van a pintar mural bien colorido","va a hacer obra de teatro","van a hacer concurso de dibujo","la biblioteca quedó bien bonita","va a tener feria de ciencias"];
for(let i=0;i<200;i++){let b=basesC[i % basesC.length];let escuela=["Técnica 51","Técnica 91","Técnica 100","Telesecundaria 88","San Alfonso 1024","Neza York"][i%6];CHISME.push(`en ${escuela} ${b} 🌸 #${i+1}`);}
let bolsaT=[...Array(200).keys()];let bolsaC=[...Array(200).keys()];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
shuffle(bolsaT);shuffle(bolsaC);
function sacarT(){if(bolsaT.length===0){bolsaT=[...Array(200).keys()];shuffle(bolsaT);}return bolsaT.pop();}
function sacarC(){if(bolsaC.length===0){bolsaC=[...Array(200).keys()];shuffle(bolsaC);}return bolsaC.pop();}
function setAlerta(t){alerta.textContent=t;alerta.style.display="block";setTimeout(()=>alerta.style.display="none",5000);}
function showGlobal(texto){globalMsg.textContent=texto.toUpperCase();globalMsg.style.display="block";setTimeout(()=>{globalMsg.style.display="none";},8000);}
function add(nombre,texto,clase){
  const d=document.createElement('div');d.className='msg '+clase;d.textContent=nombre+": "+texto;
  chat.appendChild(d);
  if(chat.children.length>50){chat.removeChild(chat.firstChild);} // SOLO 50 MENSAJES PARA NO TRABAR
  chat.scrollTop=chat.scrollHeight;
}
function limpiarChat(){chat.innerHTML="";add("SISTEMA","chat limpiado para que no se trabe tu shaifon we","mfan");}
function mostrarServidorNuevo(){
  servidorNum=Math.floor(Math.random()*99)+2;
  document.getElementById('srv').textContent=`S${servidorNum}`;
  servidorDiv.innerHTML=`HAS ACTUALIZADO LA PÁGINA<br>A LO QUE ENTRASTE A OTRO SERVIDOR<br>DIVIÉRTETE<br>Servidor #${servidorNum}`;
  servidorDiv.style.display="block";setTimeout(()=>{servidorDiv.style.display="none";},3000);
}
window.addEventListener('load',()=>{if(sessionStorage.getItem('visitado')){mostrarServidorNuevo();}sessionStorage.setItem('visitado','1');});
function ataqueCodigo(){
  const mensaje="HAN ATACADO EL CÓDIGO DE NEZA - TODAS LAS OPCIONES NO SON OFICIALES DE NEZA INTENTAREMOS RESOLVER ESTO SI NO SE PUEDE QUEDAR ASÍ";
  showGlobal(mensaje);setAlerta(mensaje);
  add("SISTEMA","han atacado el código de neza we","mcodigo");
}
function invadirChismecito(){
  if(modo==='toxico'){toggleModo();setTimeout(()=>{invadirChismecito();},700);return;}
  if(invadido) return;
  invadido=true;
  document.body.classList.add('invadido');
  let tiempoRestante=90;
  document.getElementById('timerInv').textContent=`INVADIDO ${tiempoRestante}s`;
  timerCuenta=setInterval(()=>{
    tiempoRestante--;
    document.getElementById('timerInv').textContent=`INVADIDO ${tiempoRestante}s`;
    if(tiempoRestante<=0){clearInterval(timerCuenta);document.getElementById('timerInv').textContent="";}
  },1000);
  setTimeout(()=>{add("Técnica 51 💅","haber we pasen tarea culeros a la verga","minv");},800);
  setTimeout(()=>{add("Telesecundaria 88 🌼","ay que? por qué insultan aquí 😰","msusto");},3500);
  setTimeout(()=>{add("Técnica 91 🌸","ayuda que está pasando 😭","msusto");},6000);
  setTimeout(()=>{add("Técnica 100 😈","jajaja ya llegamos culeros","minv");},8000);
  setTimeout(()=>{add("San Alfonso 697 🎀","ay no que miedo 😰","msusto");},12000);
  setTimeout(()=>{showGlobal(`INVASIÓN CONFIRMADA - CHISMECITO INVADIDO 90s`);},15000);
  if(timerInvasion) clearTimeout(timerInvasion);
  timerInvasion=setTimeout(()=>{
    invadido=false;
    document.body.classList.remove('invadido');
    clearInterval(timerCuenta);
    document.getElementById('timerInv').textContent="";
    showGlobal(`INVASIÓN TERMINADA - CHISMECITO A SALVO`);
    add("Técnica 51 💅","ay por fin se fueron 😮‍💨","msusto");
  },90000);
}
function lanzarGlobalEscuela(){
  const escuelas=["TÉCNICA 51","TÉCNICA 91","TÉCNICA 100","TELESECUNDARIA 88","SAN ALFONSO 1024"];
  const escuela=escuelas[Math.floor(Math.random()*escuelas.length)];
  const num=Math.floor(Math.random()*9000)+1000;
  showGlobal(`ANÓNIMO #${num} DE ${escuela} LE ESTA TIRANDO MIERDA A NEZA`);
}
function loop(){
 if(timer) clearTimeout(timer);
 // NO CORRE SI LA PESTAÑA NO ESTA VISIBLE (AHORRA BATERIA Y NO SE TRABA)
 if(document.hidden){timer=setTimeout(loop,1000);return;}
 if(modo==='toxico'){
   const idx=sacarT();add(botsT[idx % botsT.length],TOXICO[idx],"m0");
 } else {
   if(invadido){
     if(Math.random()<0.5){
       const idx=sacarT();add(botsT[idx % botsT.length]+" 😈",TOXICO[idx],"minv");
     } else {
       const idx=sacarC();add(botsC[idx % botsC.length],CHISME[idx],"m0");
     }
   } else {
     const idx=sacarC();add(botsC[idx % botsC.length],CHISME[idx],"m0");
   }
 }
 // MAS LENTO PARA QUE NO SE TRABE
 timer=setTimeout(loop, modo==='toxico'?1200:(invadido?800:2000));
}
function toggleModo(){
 chat.innerHTML='';
 if(modo==='toxico'){modo='chisme';document.body.className=invadido?'chisme invadido':'chisme';document.getElementById('btnModo').textContent='Tóxico';}
 else {modo='toxico';document.body.className='toxico';document.getElementById('btnModo').textContent='Chisme';}
 loop();
}
function sendUser(){
 const i=document.getElementById('inp');let val=i.value.trim();if(!val) return;
 if(val.toLowerCase().startsWith("/global")){let resto=val.substring(7).trim();if(!resto){lanzarGlobalEscuela();} else {showGlobal(resto);}i.value='';return;}
 if(val.toLowerCase().startsWith("/invadir")){invadirChismecito();i.value='';return;}
 if(val.toLowerCase().startsWith("/codigo") || val.toLowerCase().startsWith("/hack")){ataqueCodigo();i.value='';return;}
 add("TÚ",val,"mfan");i.value='';
}
loop();
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') sendUser();});
// pausa si minimizas
document.addEventListener('visibilitychange',()=>{if(!document.hidden) loop();});
</script>
</body>
</html>
