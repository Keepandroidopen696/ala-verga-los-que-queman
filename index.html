<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>697 Anónimo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif}
.w{max-width:380px;margin:0 auto;padding:10px}
.h{background:#171717;border:1px solid #222;border-radius:16px;padding:14px;text-align:center}
h1{font-family:'Anton';font-size:20px;margin:0} h1 span{color:#ffcc00}
.reglas{background:#111;border-left:3px solid #ff4444;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:10px;color:#aaa}
textarea{width:100%;background:#151515;border:1px solid #2a2a2a;color:#fff;border-radius:10px;padding:10px;min-height:68px;font-size:13px;outline:none}
.btn{width:100%;background:#ffcc00;color:#000;border:0;padding:11px;border-radius:10px;font-family:'Anton';font-size:14px;margin-top:8px}

.t{font-size:9px;color:#666;float:right}
.m{font-size:13px;margin-top:5px}

</style>
</head>
<body>
<div class="w">
<div class="h"><h1>MENSAJES ANÓNIMOS<br><span>697 - NEZA YORK</span></h1><div style="font-size:9px;color:#555">BOTS ACTIVOS - SIN API</div></div>
<div class="reglas">❌ No Gore / ❌ No +18 / ❌ No quemar con cara</div>
<textarea id="txt" placeholder="Escribe algo... los bots te responderán"></textarea>
<button class="btn" id="b" onclick="enviar()">ENVIAR COMO ANÓNIMO</button>
<div id="lista"></div>
</div>

<script>
// MEMORIA LOCAL - 100% funciona sin internet ni API
function getMensajes(){ 
  let d = JSON.parse(localStorage.getItem('mensajes697')||'[]'); 
  return d;
}
function saveMensajes(d){ localStorage.setItem('mensajes697', JSON.stringify(d)); }

const BOTS=[
{nombre:"Anónimo #1024", frases:["oigan pasen chisme de la 697","alguien vio lo de ayer?","Anónimo #{X} cuenta bien","oigan quien jala"]},
{nombre:"Anónimo #777", frases:["a la verga todos","oigan quien la debe","Anónimo #{X} ya ni la hace","que hueva"]},
{nombre:"Anónimo #404", frases:["oigan pasen tarea de mate","quien hizo la de química?","Anónimo #{X} pásala porfa"]},
{nombre:"Anónimo #13", frases:["alguien de 3ro pa hablar?","oigan quien jala al centro hoy","Anónimo #{X} háblame"]},
{nombre:"Anónimo #69", frases:["que aburrido we","alguien sin hacer nada?","oigan que pedo con la expo","x2"]}
];
function rand(a){return a[Math.floor(Math.random()*a.length)]}

function botPost(texto, nombre){
  let d=getMensajes();
  let botNombre = nombre || rand(BOTS).nombre;
  d.push({a:botNombre, m:texto, f:Date.now(), bot:true});
  saveMensajes(d); cargar();
}

function botsRespondenAlUsuario(userAnon, userTexto){
  setTimeout(()=>{
    let b = rand(BOTS);
    let frases = ["oigan Anónimo #"+userAnon+" jajaja alch si","Anónimo #"+userAnon+" cuenta más oigan","oigan Anónimo #"+userAnon+" x2 we","Anónimo #"+userAnon+" te mamaste"];
    botPost(rand(frases), b.nombre);
    // segundo bot responde al primero
    setTimeout(()=>{
      let b2 = rand(BOTS.filter(x=>x.nombre!=b.nombre));
      botPost("Anónimo #"+b.nombre.split('#')[1]+" "+rand(["cállate we","simón","jajaja","va"]), b2.nombre);
    }, 4000);
  }, 2000);
}

function conversacionEntreBots(){
  let b1=rand(BOTS); let b2=rand(BOTS.filter(b=>b.nombre!=b1.nombre));
  let frase = rand(b1.frases).replace('{X}', b2.nombre.split('#')[1]);
  botPost(frase, b1.nombre);
  setTimeout(()=> botPost(rand(["simón we","ya ni me hables","jajaja si","va oigan"]), b2.nombre), 5000);
}

function enviar(){
 let t=document.getElementById('txt').value.trim(); if(!t) return;
 if(t.toLowerCase().includes('gore')||t.toLowerCase().includes('pack')||t.toLowerCase().includes('xxx')){alert('❌ No permitido');return;}
 let n=localStorage.getItem('an697'); if(!n){n=Math.floor(Math.random()*9000)+100; localStorage.setItem('an697',n);}
 let d=getMensajes(); d.push({a:'Anónimo #'+n,m:t,f:Date.now()}); saveMensajes(d);
 document.getElementById('txt').value=''; cargar();
 botsRespondenAlUsuario(n, t);
}

function cargar(){
 let d=getMensajes(); let ahora=Date.now(); let LIM=73*60*60*1000;
 d=d.filter(x=>ahora-x.f< LIM); saveMensajes(d);
 let h=''; d.slice().reverse().slice(0,40).forEach(x=>{
   let hh=Math.floor((LIM-(ahora-x.f))/3600000);
   h+=`<div class="${x.bot?'card bot':'card'}"><span class="a">${x.a}</span><span class="t">⏳ ${hh}h</span><div class="m">${x.m.replace(/</g,'&lt;')}</div></div>`;
 });
 document.getElementById('lista').innerHTML=h||'<div style="text-align:center;color:#444;font-size:11px;margin-top:15px">Sé el primero we, los bots ya están</div>';
}
cargar();

// Si está vacío, que los bots hablen solos al entrar
if(getMensajes().length==0){ setTimeout(conversacionEntreBots, 1500); }
// Cada 3 min hablan entre ellos solos
setInterval(conversacionEntreBots, 180000);
</script>
</body>
</html>
