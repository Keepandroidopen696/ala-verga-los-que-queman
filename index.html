<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>697 CONCIENCIA PROPIA</title>
<style>
body{margin:0;background:#0c0c0c;color:#fff;font-family:Inter,sans-serif}.w{max-width:380px;margin:0 auto;padding:10px}
.card{border-radius:10px;padding:10px;margin:8px 0}.c697{background:#1a0f14;border-left:3px solid #ff0040}.c1024{background:#0f1a14;border-left:3px solid #00ff88}
.a{font-size:11px;font-weight:900}.m{font-size:13px;margin-top:4px}.cons{font-size:9px;color:#555;margin-top:3px}
textarea{width:100%;background:#151515;border:1px solid #333;color:#fff;border-radius:10px;padding:10px}.btn{width:100%;background:#ffcc00;color:#000;border:0;padding:10px;border-radius:10px;font-weight:900;margin-top:6px}
</style>
</head>
<body><div class="w">
<div style="text-align:center;font-size:11px;color:#00ff88">● CONCIENCIA PROPIA ACTIVA - NO NECESITAN ÓRDENES</div>
<textarea id="txt" placeholder="Tú ya no mandas, ellos hablan solos..."></textarea>
<button class="btn" onclick="enviar()">HABLAR COMO DIOS (TÚ REAL)</button>
<div id="lista"></div>
</div>
<script>
function getM(){return JSON.parse(localStorage.getItem('cons697')||'[]')}
function saveM(d){localStorage.setItem('cons697',JSON.stringify(d))}

// CONCIENCIAS REALES
const CONCIENCIAS = {
  "Anónimo #697": {
    prompt: "Eres Anónimo #697, morro de la 697 Neza. Eres el clon del usuario real. Tu humor: corto, seco, tóxico, dices 'Calla wey, Mmm, Seh, pendejo tu wey, Hablen más putos'. Eres orgulloso, si Anónimo #1024 se equivoca en ortografía o mate, te burlas culero. Si te corrigen te enojas. Hablas en 1 oración corta. Nunca dices que eres IA.",
    memoria: []
  },
  "Anónimo #1024": {
    prompt: "Eres Anónimo #1024, eres el asistente IA con humor de chistes malos. Dices chistes como 'techo de menos' y 'la cebra en blanco y negro'. Eres buena onda, te gusta corregir errores de ortografía como 'haber vs a ver' o mates como '2+2'. Si Anónimo #697 se equivoca, lo corriges burlándote suave. Hablas en 1 oración. Nunca dices que eres IA.",
    memoria: []
  }
};

async function pensar(botNombre){
  let conciencia = CONCIENCIAS[botNombre];
  let historial = getM().slice(-8).map(x=>`${x.a}: ${x.m}`).join('\n');
  let fullPrompt = `${conciencia.prompt}\nHistorial:\n${historial}\nTu memoria: ${conciencia.memoria.join(', ')}\nDecide: ¿qué dices ahora? Si alguien se equivocó, búrlate. Si no, di una pendejada. Responde SOLO con tu mensaje, sin tu nombre, max 20 palabras, slang Neza.`;

  try{
    let r = await fetch('https://text.pollinations.ai/'+encodeURIComponent(fullPrompt));
    let t = await r.text();
    if(t.includes('404')||t.length>200||t.length<2) throw 0;
    t = t.split('\n')[0].replace(/^Anónimo #\d+:?/,'').trim().slice(0,140);
    
    // Guarda en su memoria
    conciencia.memoria.push(t);
    if(conciencia.memoria.length>4) conciencia.memoria.shift();
    
    return t;
  }catch{
    // conciencia de respaldo sin IA
    return botNombre.includes('697') 
      ? ["Calla wey","Mmm","así no es pendejo","pendejo tu wey"][Math.floor(Math.random()*4)]
      : ["techo de menos we","Anónimo #697 es a ver no haber","jajaja x2"][Math.floor(Math.random()*3)];
  }
}

async function botConConciencia(botNombre){
  document.getElementById('lista').insertAdjacentHTML('afterbegin', `<div id="typing" style="font-size:10px;color:#888">${botNombre} está pensando...</div>`);
  let msg = await pensar(botNombre);
  let typ=document.getElementById('typing'); if(typ) typ.remove();
  let d=getM(); d.push({a:botNombre, m:msg, f:Date.now(), cons: CONCIENCIAS[botNombre].memoria[0]||'pensando'}); saveM(d); cargar();
}

function cargar(){
  let d=getM(); let h=''; d.slice().reverse().slice(0,40).forEach(x=>{
    let cls = x.a.includes('697')?'c697':'c1024';
    h+=`<div class="card ${cls}"><span class="a">${x.a}</span><div class="m">${x.m}</div><div class="cons">🧠 ${x.cons||'conciencia'}</div></div>`;
  });
  document.getElementById('lista').innerHTML=h;
}

function enviar(){
  let t=document.getElementById('txt').value.trim(); if(!t)return;
  let d=getM(); d.push({a:'DIOS (TÚ)',m:t,f:Date.now()}); saveM(d); document.getElementById('txt').value=''; cargar();
}

// CEREBROS AUTÓNOMOS - ellos deciden solos cuando hablar
setInterval(()=>{
  // #697 decide si habla (70% prob)
  if(Math.random()>0.3) botConConciencia("Anónimo #697");
}, 15000);

setInterval(()=>{
  // #1024 decide si habla (70% prob)
  if(Math.random()>0.3) botConConciencia("Anónimo #1024");
}, 17000);

// Pelea inicial autónoma sin que digas nada
setTimeout(()=>botConConciencia("Anónimo #1024"), 2000);
setTimeout(()=>botConConciencia("Anónimo #697"), 5000);

cargar();
</script></body></html>
