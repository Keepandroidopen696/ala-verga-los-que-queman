<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEZA YORK NEGRO FINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#ddd;font-family:monospace;height:100vh;display:flex;flex-direction:column}
header{padding:8px 10px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
#global{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff0000;color:#ffeb00;padding:14px;text-align:center;font-weight:900;font-size:12px;border-bottom:3px solid #ffeb00}
#alerta{display:none;background:#ff0000;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:11px;border:2px solid #ffeb00;margin:6px;margin-top:60px}
#chat{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.msg{background:#0f0f0f;border:1px solid #1a1a1a;padding:6px 8px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg b{font-size:10px;color:#888;font-weight:600;white-space:nowrap}
.msg span{flex:1;word-break:break-word}
.mfan{border-left:2px solid #333}
.moficial{border:1px solid #ffcc00;background:#1a1600}
.moficial b{color:#ffcc00;font-size:11px}
.btnReport{font-size:9px;background:#111;border:1px solid #333;color:#666;padding:2px 6px;border-radius:10px;cursor:pointer}
.btnReport:hover{background:#ff0000;color:#fff;border-color:#ff0000}
#controls{display:flex;padding:8px;gap:6px;border-top:1px solid #222}
input{flex:1;background:#111;color:#fff;border:1px solid #222;padding:10px;border-radius:20px}
button#send{border:none;background:#222;color:#fff;padding:0 14px;border-radius:20px;font-weight:bold}
button.small{border:none;background:#111;color:#888;border:1px solid #222;padding:5px 8px;border-radius:20px;font-size:10px}
#srv{font-size:10px;color:#555}
</style>
</head>
<body>
<div id="global"></div>
<div id="alerta"></div>
<header>
<div id="srv">Servidor #1 - 1,247,392 online</div>
<div style="display:flex;gap:4px">
<button class="small" onclick="lanzarGlobal()">GLOBAL</button>
<button class="small" onclick="limpiar()">LIMPIAR</button>
</div>
</header>
<div id="chat"></div>
<div id="controls">
<input id="inp" placeholder="Escribe o /global">
<button id="send" onclick="sendUser()">></button>
</div>
<script>
const chat=document.getElementById('chat');
const alerta=document.getElementById('alerta');
const globalDiv=document.getElementById('global');

let bots=["Técnica 51","Técnica 91","Técnica 100","Telesecundaria 88","San Alfonso 1024","San Alfonso 697","Telesecundaria 115"];
let frases=[
"haber we pasen tarea","que pedo pendejos de la {esc}","nmms que hueva","alch chinga tu madre","wey no mames que culero","jajaja techo de menos pendejo","haber pinche morro pendejo","a ver es a ver no haber verga","ya callate a la verga","chesco y a chingar a su madre","haber quien se rifa un tiro","que pedo hijos de su puta madre","nmms me vale verga","alch me la pelan los de la {esc}","wey chinga tu madre si eres de la {esc}","jajaja pinche vato pendejo","haber we prestame 10 varos","es a ver no haber pendejo de mierda","techo de menos burro","que pedo con tu ortografia culera"
];

const ALERTA="ADVERTENCIA NECESITAMOS ORDEN EN LA PÁGINA O DE LO CONTRARIO LO TOMARAN COMO INFRINGIR LAS REGLAS Y TENDREMOS QUE INHABILITAR LA PAGINA AQUI EN NEZA NO TOLERAMOS ESAS FALTAS EN LA PÁGINA WEB O SERAS SANCIONADO SIN PODER ENTRAR A LA PÁGINA WEB";

const MENSAJES_OFICIAL=[
"Aquí en Neza no toleramos los insultos, si eres reportado te vas de la página sin llorar.",
"NezaOfficial: Les recordamos que en Neza York se debe mantener el respeto, usuario reportado será sancionado.",
"Aquí en Neza no toleramos faltas de respeto, si infringes las reglas te vas de la página sin llorar.",
"NezaOfficial: Mantengan el orden, si eres reportado por insultos serás retirado de la página sin llorar.",
"Aquí en Neza no toleramos que le tiren mierda a Neza York, reportado te vas sin llorar.",
"NezaOfficial: Esta página es de Neza para Neza, respeta o te vas sin llorar.",
"Aquí en Neza no toleramos el desorden, si eres reportado quedas fuera de la página sin llorar."
];

let timer=null;
let bolsa=[...Array(500).keys()];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
shuffle(bolsa);
function sacar(){if(bolsa.length===0){bolsa=[...Array(500).keys()];shuffle(bolsa);}return bolsa.pop();}

function setAlerta(t){
 alerta.textContent=t;
 alerta.style.display="block";
 setTimeout(()=>alerta.style.display="none",7000);
}
function showGlobal(t){
 globalDiv.textContent=t.toUpperCase();
 globalDiv.style.display="block";
 setTimeout(()=>globalDiv.style.display="none",9000);
}

function add(nombre,texto,clase=""){
 const div=document.createElement('div');
 div.className='msg '+clase;
 const name=document.createElement('b');
 name.textContent=nombre;
 const msg=document.createElement('span');
 msg.textContent=texto;
 const rep=document.createElement('button');
 rep.className='btnReport';
 rep.textContent='reportar';
 rep.onclick=()=>reportar(nombre,texto,div);
 div.appendChild(name);
 div.appendChild(msg);
 div.appendChild(rep);
 chat.appendChild(div);
 if(chat.children.length>90) chat.removeChild(chat.firstChild);
 chat.scrollTop=chat.scrollHeight;
}

function reportar(nombre,texto,div){
 div.style.borderColor="#ff0000";
 showGlobal(`REPORTE ENVIADO A NEZA - MENSAJE DE ${nombre.toUpperCase()} REPORTADO`);
 setAlerta(`REPORTE RECIBIDO: SE REVISA MENSAJE DE ${nombre.toUpperCase()} POR INFRINGIR REGLAS`);
 setTimeout(()=>addOficial(),700);
}

function addOficial(){
 const texto=MENSAJES_OFICIAL[Math.floor(Math.random()*MENSAJES_OFICIAL.length)];
 add("NezaOfficial:",texto,"moficial");
}

function lanzarGlobal(){
 const esc=bots[Math.floor(Math.random()*bots.length)].toUpperCase();
 const num=Math.floor(Math.random()*9000)+1000;
 const msg=`ANÓNIMO #${num} DE ${esc} LE ESTA TIRANDO MIERDA A NEZA`;
 showGlobal("🚨 "+msg+" 🚨");
 setAlerta(ALERTA);
 setTimeout(()=>add(bots[Math.floor(Math.random()*bots.length)],`QUE PEDO CON EL ANONIMO #${num} DE ${esc} CULERO`,""),400);
 setTimeout(()=>add(bots[Math.floor(Math.random()*bots.length)],`alch ese anonimo #${num} de ${esc} que se vaya a la verga`,""),900);
 setTimeout(()=>addOficial(),1500);
}

function loop(){
 if(timer) clearTimeout(timer);
 const idx=sacar();
 let escuela=bots[idx % bots.length];
 let base=frases[idx % frases.length];
 base=base.replace("{esc}",escuela);
 add(escuela, base+" #"+idx);
 timer=setTimeout(loop, 450);
}

function sendUser(){
 const i=document.getElementById('inp');
 let val=i.value.trim();
 if(!val) return;
 if(val.toLowerCase().startsWith("/global")){
   let resto=val.substring(7).trim();
   if(!resto) lanzarGlobal();
   else {showGlobal(resto);setAlerta(ALERTA);setTimeout(()=>addOficial(),800);}
   i.value="";return;
 }
 add("TÚ",val,"mfan");
 const low=val.toLowerCase();
 if(low.includes("neza") && (low.includes("no rifa")||low.includes("vale verga")||low.includes("puro pendejo")||low.includes("culero")||low.includes("mierda")||low.includes("no sirve"))){
   showGlobal(`ANÓNIMO LE ESTA TIRANDO MIERDA A NEZA - ${val.toUpperCase().slice(0,60)}`);
   setAlerta(ALERTA);
   setTimeout(()=>add(bots[0],`que pedo contigo we por que le tiras a Neza York culero`,""),500);
   setTimeout(()=>add(bots[1],`alch chinga tu madre si no te gusta Neza York`,""),1100);
   setTimeout(()=>addOficial(),1900);
 }
 i.value="";
}
function limpiar(){chat.innerHTML="";}

setAlerta(ALERTA);
loop();
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') sendUser();});
</script>
</body>
</html>
