<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEZA YORK GLOBAL ESCUELAS</title>
<style>
body{margin:0;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
#global{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;padding:18px;text-align:center;font-weight:900;font-size:14px;letter-spacing:0.5px;border-bottom:4px solid #fff;animation:shake 0.3s infinite;line-height:1.2}
#alerta{display:none;padding:10px;text-align:center;font-weight:bold;font-size:11px;border:3px solid;margin:6px;margin-top:60px}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{padding:7px 12px;border-radius:14px;font-size:13px;max-width:88%}
#controls{display:flex;padding:8px;gap:6px}
input{flex:1;padding:12px;border-radius:24px;border:none}
button{border:none;padding:8px 12px;border-radius:24px;font-weight:bold;cursor:pointer;font-size:12px}
#btnGlobal{background:#ff0000;color:yellow;border:2px solid yellow;animation:blink 0.7s infinite}
body.toxico{background:#000;color:#fff}body.toxico header{background:#111;border-bottom:2px solid #ffcc00}
body.toxico #global{background:#ff0000;color:yellow;border-color:yellow;box-shadow:0 0 20px red}
body.toxico #alerta{background:#ff0000;color:#fff;border-color:yellow}body.toxico #chat{background:#080808}
body.toxico .m0{background:#1a1010;border-left:3px solid red}body.toxico .m1{background:#101a14;border-left:3px solid #00ff88}
body.toxico .m2{background:#10141a;border-left:3px solid #0099ff}body.toxico .mfan{background:#332a00;border-left:4px solid #ffcc00}
body.toxico .mdef{background:#2a1010;border-left:4px solid red}body.toxico #controls{background:#111}
body.toxico input{background:#222;color:#fff}body.toxico button#btnModo{background:#ffcc00;color:#000}
body.chisme{background:#fef9ef;color:#4a4a4a}body.chisme header{background:#ffecd1;border-bottom:2px solid #ffbf69}
body.chisme #global{background:#ff006e;color:white;border-color:#ffb703;box-shadow:0 0 20px #ff006e}
body.chisme #alerta{background:#fff3b0;color:#6b4c00;border-color:#ffbf69;border-radius:12px}body.chisme #chat{background:#fffaf0}
body.chisme .m0{background:#ffe5d9;border-left:4px solid #ff7f51}body.chisme .m1{background:#d8e2dc;border-left:4px solid #52b788}
body.chisme .m2{background:#cce3de;border-left:4px solid #40916c}body.chisme .mfan{background:#fff3b0;border-left:4px solid #ffb703}
body.chisme #controls{background:#ffecd1}body.chisme input{background:#fff;border:1px solid #ffbf69}body.chisme button#btnModo{background:#ffb703}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(2px)}50%{transform:translateX(-2px)}100%{transform:translateX(0)}}
@keyframes blink{0%{background:#ff0000}50%{background:#990000}100%{background:#ff0000}}
</style>
</head>
<body class="toxico">
<div id="global"></div>
<header>
<div>● <b id="counter">1,247,392 personas escribiendo...</b></div>
<div style="display:flex;gap:5px">
<button id="btnGlobal" onclick="lanzarGlobalEscuela()">🚨 GLOBAL</button>
<button id="btnModo" onclick="toggleModo()">🌸 Chismecito</button>
</div>
<div id="titulo" style="font-size:10px">NEZA YORK - GLOBAL ESCUELAS</div>
</header>
<div id="alerta"></div>
<div id="chat"></div>
<div id="controls"><input id="inp" placeholder="Escribe /global o pica GLOBAL"><button onclick="sendUser()">Enviar</button></div>
<script>
let modo='toxico';let timer=null;
const chat=document.getElementById('chat');const alerta=document.getElementById('alerta');const globalMsg=document.getElementById('global');
const botsT=["Técnica 51","Técnica 91","Técnica 100","Telesecundaria 88","Telesecundaria 115","San Alfonso 1024","San Alfonso 697"];
const botsC=["Técnica 51 💅","Técnica 91 🌸","Técnica 100 ☕","Telesecundaria 88 🌼","San Alfonso 1024 📚","San Alfonso 697 🎀","Telesecundaria 12 ✨"];
const basesT=["haber we pasen tarea","que pedo pendejos de la","nmms que hueva","alch chinga tu madre","wey no mames que culero","jajaja techo de menos pendejo","haber pinche morro pendejo","a ver es a ver no haber verga","ya callate a la verga","chesco y a chingar a su madre","haber quien se rifa un tiro","que pedo hijos de su puta madre","nmms me vale verga","alch me la pelan los de la","wey chinga tu madre si eres de la","jajaja pinche vato pendejo","haber we prestame 10 varos","es a ver no haber pendejo de mierda","techo de menos burro","que pedo con tu ortografia culera"];
let TOXICO=[];let CHISME=[];
for(let i=0;i<500;i++){let b=basesT[i%basesT.length];let escuela=botsT[i%botsT.length];let extra=["culero","a la verga","we","nmms","alch","jajaja","pinche morro"][i%7];TOXICO.push(`${b} ${escuela} ${extra} #${i+1}`);}
const basesC=["van a hacer kermés bien bonita","van a vender fresas con crema","ganó concurso de baile","va a hacer excursión al museo","la maestra nos va a dejar salir temprano","van a poner jardín bien bonito","van a vender elotes bien ricos","van a hacer torneo de futbol amistoso","va a tener día de disfraces bonito","va a hacer picnic con frutita","van a pintar mural bien colorido","va a hacer obra de teatro","van a hacer concurso de dibujo","la biblioteca quedó bien bonita","va a tener feria de ciencias"];
for(let i=0;i<500;i++){let b=basesC[i%basesC.length];let escuela=["Técnica 51","Técnica 91","Técnica 100","Telesecundaria 88","San Alfonso 1024","Neza York"][i%6];CHISME.push(`chisme #${i+1}: oigan que en ${escuela} ${b} 🌸`);}
let bolsaT=[...Array(500).keys()];let bolsaC=[...Array(500).keys()];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
shuffle(bolsaT);shuffle(bolsaC);
function sacarT(){if(bolsaT.length===0){bolsaT=[...Array(500).keys()];shuffle(bolsaT);}return bolsaT.pop();}
function sacarC(){if(bolsaC.length===0){bolsaC=[...Array(500).keys()];shuffle(bolsaC);}return bolsaC.pop();}
const ALERTA_TOXICA="ADVERTENCIA NECESITAMOS ORDEN EN LA PÁGINA O DE LO CONTRARIO LO TOMARAN COMO INFRINGIR LAS REGLAS Y TENDREMOS QUE INHABILITAR LA PAGINA AQUI EN NEZA NO TOLERAMOS ESAS FALTAS EN LA PÁGINA WEB O SERAS SANCIONADO SIN PODER ENTRAR A LA PÁGINA WEB";
const ALERTA_CHISME="☕ CHISMECITO TIME: NECESITAMOS BUEN ROLLO EN LA PÁGINA, AQUÍ EN NEZA VALORAMOS EL RESPETO, SI HACES CHISME FEO TE DAMOS TIME OUT DE 5 MIN SIN PODER CHISMEAR ☕";
function setAlerta(t){alerta.textContent=t;alerta.style.display="block";setTimeout(()=>alerta.style.display="none",7000);}
function showGlobal(texto){
  globalMsg.textContent=texto.toUpperCase();
  globalMsg.style.display="block";
  setTimeout(()=>{globalMsg.style.display="none";},10000);
}
function lanzarGlobalEscuela(){
  const escuelas=["TÉCNICA 51","TÉCNICA 91","TÉCNICA 100","TELESECUNDARIA 88","TELESECUNDARIA 115","SAN ALFONSO 1024","SAN ALFONSO 697","TELESECUNDARIA 12","SAN ALFONSO 514"];
  const escuela=escuelas[Math.floor(Math.random()*escuelas.length)];
  const num=Math.floor(Math.random()*9000)+1000;
  const mensajes=[
    `🚨 ANÓNIMO #${num} DE ${escuela} LE ESTA TIRANDO MIERDA A NEZA 🚨`,
    `🚨 ${escuela} - ANÓNIMO #${num} LE ESTA TIRANDO MIERDA A NEZA YORK 🚨`,
    `🚨 ATENCIÓN: ANÓNIMO #${num} DE LA ${escuela} ESTA HABLANDO MAL DE NEZA 🚨`,
    `🚨 ${escuela} | ANÓNIMO #${num} TIRANDO MIERDA A NEZA YORK 🚨`
  ];
  const final=mensajes[Math.floor(Math.random()*mensajes.length)];
  showGlobal(final);
}
function add(nombre,texto,clase){
 const d=document.createElement('div');d.className='msg '+clase;
 d.innerHTML='<b>'+nombre+'</b> '+texto;chat.appendChild(d);
 if(chat.children.length>150) chat.removeChild(chat.firstChild);
 chat.scrollTop=chat.scrollHeight;
 const low=texto.toLowerCase();
 if(low.includes("neza york") && (low.includes("no rifa")||low.includes("puro pendejo")||low.includes("vale verga")||low.includes("cree que hace"))){
   // cuando insultan, lanza global con escuela
   const esc=botsT[Math.floor(Math.random()*botsT.length)].toUpperCase();
   const num=Math.floor(Math.random()*9000)+1000;
   showGlobal(`🚨 ANÓNIMO #${num} DE ${esc} LE ESTA TIRANDO MIERDA A NEZA 🚨`);
   if(modo==='toxico'){
     setAlerta(ALERTA_TOXICA);
     setTimeout(()=>{add("Técnica 51","que pedo con ese pendejo que habla de neza culero callate a la verga","mdef");},400);
     setTimeout(()=>{add("San Alfonso 1024","neza rifa hijo de su puta madre no hables de neza culero","mdef");},900);
     setTimeout(()=>{add("Técnica 91","haber we pero pensandolo bien... neza si rifa culero","m0");},3500);
     setTimeout(()=>{add("Telesecundaria 88","nmms we me estoy dando cuenta que neza si es la mera verdura","m1");},4800);
     setTimeout(()=>{add("San Alfonso 697","a la verga we si es cierto Neza York rifa bien culero","mfan");},6500);
     setTimeout(()=>{add("Técnica 100","ESE WE ME HIZO DARME CUENTA, NEZA YORK ES DIOS A LA VERGA","mfan");},7200);
   }
 }
}
function loop(){
 if(timer) clearTimeout(timer);
 if(modo==='toxico'){const idx=sacarT();const nombre=botsT[idx % botsT.length];const texto=TOXICO[idx];add(nombre,texto,["m0","m1","m2"][idx%3]);}
 else {const idx=sacarC();const nombre=botsC[idx % botsC.length];const texto=CHISME[idx];add(nombre,texto,["m0","m1","m2"][idx%3]);}
 timer=setTimeout(loop, modo==='toxico'?650:1400);
}
function toggleModo(){
 chat.innerHTML='';
 if(modo==='toxico'){modo='chisme';document.body.className='chisme';document.getElementById('btnModo').textContent='🔥 Tóxico';document.getElementById('titulo').textContent='CHISMECITO - GLOBAL ESCUELA';document.getElementById('inp').placeholder='Escribe /global o pica GLOBAL';setAlerta(ALERTA_CHISME);}
 else {modo='toxico';document.body.className='toxico';document.getElementById('btnModo').textContent='🌸 Chismecito';document.getElementById('titulo').textContent='NEZA YORK - GLOBAL ESCUELA';document.getElementById('inp').placeholder='Escribe /global o pica GLOBAL';setAlerta(ALERTA_TOXICA);}
 loop();
}
function sendUser(){
 const i=document.getElementById('inp');let val=i.value.trim();if(!val) return;
 if(val.toLowerCase().startsWith("/global")){
   let resto=val.substring(7).trim();
   if(!resto){
     lanzarGlobalEscuela(); // si solo pone /global, lanza con escuela random
   } else {
     showGlobal("🚨 "+resto+" 🚨");
   }
   i.value='';return;
 }
 add("TÚ",val,"mfan");i.value='';
}
setAlerta(ALERTA_TOXICA);loop();
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') sendUser();});
</script>
</body>
</html>
