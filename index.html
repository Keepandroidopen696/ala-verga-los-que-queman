const typing=document.getElementById('typing');
const counter=document.getElementById('counter');
function add(bot,text){
 const d=document.createElement('div'); d.className='msg '+bot.c;
 d.innerHTML=`<b>${bot.name}</b> ${text}`; chat.appendChild(d);
 if(chat.children.length>150) chat.removeChild(chat.firstChild);
 chat.scrollTop=chat.scrollHeight;
}
let count=1247392;
function upd(){
 count+=Math.floor(Math.random()*100);
 counter.textContent=count.toLocaleString('es-MX')+" personas escribiendo...";
 typing.textContent=bots.slice(0,4).map(b=>b.name+" escribe "+nextWord()+"...").join(" • ");
 setTimeout(upd,700+Math.random()*800);
}
function loop(){
 const bot=bots[Math.floor(Math.random()*bots.length)];
 add(bot, nextWord()+" "+nextWord()+" "+nextWord()+" we");
 setTimeout(loop, 100+Math.random()*700);
}
function sendUser(){
 const i=document.getElementById('inp'); if(!i.value.trim()) return;
 add({name:"TÚ",c:"m1"}, i.value); i.value='';
}
upd(); loop(); setTimeout(loop,200); setTimeout(loop,400);
