
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Página temporalmente fuera de servicio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #0b0d10;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }

    h1 {
      color: #ffffff;
      font-size: clamp(26px, 6vw, 36px);
      margin-bottom: 18px;
    }

    .message {
      color: #9ca3af;
      font-size: 16px;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin: 28px 0;
      padding: 10px 16px;
      border: 1px solid #713f12;
      border-radius: 30px;
      background: #271b0c;
      color: #fbbf24;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 35px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon" aria-hidden="true">⚙️</div>

    <h1>Volveremos pronto</h1>

    <p class="message">
      Nuestra página web se encuentra temporalmente
      fuera de servicio.<br>
      Estamos trabajando para restablecerla lo antes posible.
      <br><br>
      Regresaremos en unos minutos.
    </p>

    <div class="status">
      ● MANTENIMIENTO EN CURSO
    </div>

    <p class="message">
      Gracias por tu paciencia y comprensión.
    </p>

    <div class="footer">
      HTTP STATUS: 503<br>
      SERVICIO TEMPORALMENTE NO DISPONIBLE
    </div>
  </main
   >
</body>
</html>
